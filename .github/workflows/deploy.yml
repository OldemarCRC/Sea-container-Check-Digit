# Build and deploy to GitHub Pages on every push to main.
# Replaces the `gh-pages` npm package (its dependency chain carried
# GHSA-vfj7-8cjw-p6xm in `braces`, which has no patched release).
# SECURITY: least-privilege token, lockfile-exact install, production audit gate.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Exact versions from package-lock.json; no install scripts from deps.
      - run: npm ci --ignore-scripts

      # Fail the deploy if any dependency has a high/critical advisory.
      - run: npm audit --audit-level=high

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
